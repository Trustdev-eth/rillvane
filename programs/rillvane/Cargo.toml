[package]
name = "rillvane"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Rillvane inventory pool, supply claims, and collateral credit"

[lib]
crate-type = ["cdylib", "lib"]
name = "rillvane"

[features]
no-entrypoint = []
test-sbf = []

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[dependencies]
borsh = "1.5"
solana-program = "2.2"
spl-token = { version = "7.0.0", default-features = false, features = ["no-entrypoint"] }
